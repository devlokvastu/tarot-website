<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TrikalDarshi Tarot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="api-client.js"></script>
    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: #111827;
            --primary-color: #eab308;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 440px;
        }

        .reset-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .reset-accent-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #3b82f6, #a855f7);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .reset-badge-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .reset-header h1 {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .reset-header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #6b7280;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 13px 42px 13px 40px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #10b981;
            background: rgba(0, 0, 0, 0.55);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }

        .btn-toggle-eye {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .btn-toggle-eye:hover {
            color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5);
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-accent-bar"></div>

            <div class="reset-header">
                <div class="reset-badge-icon">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1>Set New Password</h1>
                <p>Choose a new password to secure your admin portal</p>
            </div>

            <div id="reset-alert" class="alert-box">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="reset-alert-text"></span>
            </div>

            <form id="form-reset" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="new-password">New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('new-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('confirm-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-reset-submit">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Update Password & Proceed to Login</span>
                </button>
            </form>

            <div style="text-align: center;">
                <a href="login.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            const alertBox = document.getElementById('reset-alert');
            const alertText = document.getElementById('reset-alert-text');
            alertBox.className = 'alert-box alert-error';
            alertBox.style.display = 'flex';
            alertText.innerHTML = '<strong>No Reset Token Provided:</strong><br>Please click the reset password link directly from your Google Sheet.';
            document.getElementById('form-reset').style.display = 'none';
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('reset-alert');
            const alertText = document.getElementById('reset-alert-text');
            const btn = document.getElementById('btn-reset-submit');

            alertBox.style.display = 'none';

            if (newPassword.length < 6) {
                alertBox.className = 'alert-box alert-error';
                alertBox.style.display = 'flex';
                alertText.innerText = 'Password must be at least 6 characters long.';
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert-box alert-error';
                alertBox.style.display = 'flex';
                alertText.innerText = 'Passwords do not match. Please re-enter.';
                return;
            }

            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Updating...</span>';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    alertBox.className = 'alert-box alert-success';
                    alertBox.style.display = 'flex';
                    alertText.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + (data.message || 'Password updated successfully! Redirecting...');
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Updated!</span>';
                    btn.style.background = '#10b981';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1800);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = originalBtnHtml;
                    alertBox.className = 'alert-box alert-error';
                    alertBox.style.display = 'flex';
                    alertText.innerText = data.error || 'Failed to update password. Link may be expired.';
                }
            } catch (err) {
                console.error('Reset error', err);
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
                alertBox.className = 'alert-box alert-error';
                alertBox.style.display = 'flex';
                alertText.innerText = 'Connection error. Please try again.';
            }
        }
    </script>
</body>
</html>
