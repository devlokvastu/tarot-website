<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmed | TrikalDarshi Tarot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Cosmic background -->
    <style>
        .success-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .success-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 50px 30px;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .check-icon {
            font-size: 5rem;
            color: #10b981; /* Green success */
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-block;
            background: var(--ig-gradient);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(220, 39, 67, 0.4);
        }
    </style>
</head>
<body class="success-page">
    <div class="success-card">
        <div class="check-icon" id="status-icon">✅</div>
        <h1 id="status-title">Payment Received, Booking Confirmed</h1>
        <p id="status-desc">Thank you so much for your booking. You will receive a call on your contact number exactly at your scheduled time.</p>
        <p id="status-ref" style="display:none; font-size:0.88rem; opacity:0.85; margin-top:-10px; margin-bottom:20px;"></p>
        <a href="index.html" class="home-btn">Return to Homepage</a>
    </div>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const bookingId = params.get('bookingId') || '';
            const paymentId = params.get('paymentId') || '';
            const isConflict = params.get('conflict') === '1';
            const conflictMsg = params.get('msg') || '';

            if (isConflict) {
                const iconEl = document.getElementById('status-icon');
                const titleEl = document.getElementById('status-title');
                const descEl = document.getElementById('status-desc');
                if (iconEl) { iconEl.textContent = '⚠️'; iconEl.style.color = '#fbbf24'; }
                if (titleEl) titleEl.textContent = 'Payment Received — Reschedule Needed';
                if (descEl) descEl.textContent = conflictMsg || 'Payment received! Your chosen slot was booked seconds ago, so our team will contact you shortly to reschedule.';
            }

            const parts = [];
            if (bookingId) parts.push('Booking ID: ' + bookingId);
            if (paymentId) parts.push('Payment ID: ' + paymentId);
            if (parts.length) {
                const refEl = document.getElementById('status-ref');
                if (refEl) {
                    refEl.textContent = parts.join('  •  ');
                    refEl.style.display = 'block';
                }
            }
        })();
    </script>
</body>
</html>
